<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>منصة التحضير</title>

<style>
/* Layout: app shell — sticky top bar, single column of cards (max 720px), fixed bottom tab bar */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface2:#e4ecec; --line:#c3d0d0; --fg:#14201f; --muted:#5a6b6a;
  --accent:#2f8f98; --accent-ink:#ffffff; --accent-soft:#d6eef0; --warm:#c47a2c; --ok:#1f7a45; --ok-soft:#d8f0e1; --danger:#b23a3a;
  --c1:#2f8f98; --c1s:#d9f0f2; --c2:#d4892a; --c2s:#fbecd6; --c3:#d9583f; --c3s:#fbe3dd; --c4:#6b55c4; --c4s:#e9e4fa; --c5:#2f7f4f; --c5s:#dcf0e3; --ink-on:#ffffff;
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --paperfont:"Noto Naskh Arabic","Traditional Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111617; --surface:#1b2224; --surface2:#232c2e; --line:#3a4648; --fg:#eef3f3; --muted:#9aa9aa;
  --accent:#7cc3cb; --accent-ink:#0f2023; --accent-soft:#213a3e; --warm:#e0a060; --ok:#7fd49c; --ok-soft:#1d3426; --danger:#ef8a8a;
  --c1:#5fb8c2; --c1s:#1d3a3e; --c2:#e7a24d; --c2s:#3b2c17; --c3:#ee7b62; --c3s:#3d211b; --c4:#9a86ea; --c4s:#28233f; --c5:#6cc28f; --c5s:#1c3326; --ink-on:#101617;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111617; --surface:#1b2224; --surface2:#232c2e; --line:#3a4648; --fg:#eef3f3; --muted:#9aa9aa;
  --accent:#7cc3cb; --accent-ink:#0f2023; --accent-soft:#213a3e; --warm:#e0a060; --ok:#7fd49c; --ok-soft:#1d3426; --danger:#ef8a8a;
  --c1:#5fb8c2; --c1s:#1d3a3e; --c2:#e7a24d; --c2s:#3b2c17; --c3:#ee7b62; --c3s:#3d211b; --c4:#9a86ea; --c4s:#28233f; --c5:#6cc28f; --c5s:#1c3326; --ink-on:#101617;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html,body{direction:rtl}
body{color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6;text-align:right}
input,select,textarea{direction:rtl;text-align:right}
input[type=date]{direction:ltr;text-align:right}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.brand{font-size:21px;font-weight:700;flex:1;min-width:0}
.back{border:0;background:none;font-size:24px;padding:4px 6px;line-height:1}
.badge{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.badge.busy{background:var(--surface2);color:var(--muted)}
.iconbtn{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
main{padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1240px}
.pgrid{display:grid;gap:16px;align-items:start}
.pgrid>*{min-width:0}
.pgrid>div{display:flex;flex-direction:column;gap:14px}
@media (min-width:1180px){.pgrid{grid-template-columns:830px minmax(0,1fr)}.pgrid>div{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}}
.paperwrap .paper{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lgrid{display:grid;gap:18px;align-items:start}
.lgrid>*{min-width:0;display:flex;flex-direction:column;gap:14px}
@media (min-width:960px){.lgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.pvpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}}
.pvpanel{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px}
.pvtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fit{background:var(--surface2);border-radius:12px;padding:8px;overflow:hidden}
.fit .paper{box-shadow:0 1px 6px rgba(0,0,0,.12)}
.btn.c1{background:var(--c1);border-color:var(--c1);color:var(--ink-on)}
.btn.c2{background:var(--c2s);border-color:transparent;color:var(--c2)}
.btn.c3{background:var(--c3s);border-color:transparent;color:var(--c3)}
.btn.c4{background:var(--c4s);border-color:transparent;color:var(--c4)}
.btn.c5{background:var(--c5s);border-color:transparent;color:var(--c5)}
.btn.c2f{background:var(--c2);border-color:var(--c2);color:var(--ink-on)}
.btn.c3f{background:var(--c3);border-color:var(--c3);color:var(--ink-on)}
.btn.c4f{background:var(--c4);border-color:var(--c4);color:var(--ink-on)}
.card.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1s)}
.ucard{display:flex;align-items:center;gap:16px;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px}
.ubadge{width:64px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:700;flex:none}
.ucard .ut{font-size:18px;font-weight:700;line-height:1.5}
.ucard .us{color:var(--muted);font-size:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.last{color:var(--c5);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.last::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c5)}
.distcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 20px;text-align:start;display:flex;flex-direction:column;gap:4px;width:100%}
.distcard b{font-size:19px}
.week{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.week.now{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1s)}
.week h3{margin:0;font-size:17px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--surface2);border-radius:10px;padding:9px 12px;text-align:start;width:100%}
.wrow .n{color:var(--c1);font-weight:700;white-space:nowrap;font-size:14px}
.wnote{color:var(--c3);font-weight:700;font-size:14px}
h1{font-size:24px;margin:4px 0;text-wrap:balance;line-height:1.4}
h2{font-size:19px;margin:10px 0 0}
.crumb{color:var(--accent);font-size:15px;border:0;background:none;padding:0;text-align:start}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;
  border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 20px;font-size:18px;font-weight:600}
.row .sub{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:2px}
.row .chev{color:var(--muted);font-size:20px}
.feature{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:22px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:130px}
.feature.hl{border-color:transparent;background:var(--c1s)}
.feature.wm{border-color:transparent;background:var(--c2s)}
.feature.wm .ic{color:var(--c2)}
.feature b{font-size:21px;display:flex;gap:10px;align-items:center}
.feature .ic{color:var(--warm)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sess-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sess-h .n{color:var(--accent);font-weight:700}
.pill{font-size:13px;padding:3px 12px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.edit{background:var(--accent-soft);color:var(--accent)}
.sess-t{font-size:17px;font-weight:600}
.actions{display:flex;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;min-height:50px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.sq{width:56px;padding:0;display:grid;place-items:center}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px;line-height:1.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.item{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item .num{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;font-weight:600}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.item textarea{min-height:56px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;width:100%}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 14px;font-size:14px;color:var(--muted)}
.chip.on{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.del{border:0;background:none;color:var(--danger);font-size:13px;padding:2px 4px}
.idea{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.menu{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface2)}
.menu button{border:0;background:none;text-align:start;padding:10px;border-radius:10px}
.menu button:hover{background:var(--surface)}
.confirm{border:1px solid var(--danger);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted)}
.datebar b{color:var(--fg)}
.datebtn{position:relative;overflow:hidden;display:inline-grid;place-items:center}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.paperwrap{overflow-x:auto;border-radius:12px;background:var(--surface2);padding:10px}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:9;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-weight:600;border-top:3px solid transparent}
.tabbar button.on{color:var(--accent);border-top-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:20;font-size:14px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.row,.btn,.feature{transition:border-color .15s,transform .1s}.row:active,.btn:active,.feature:active{transform:scale(.99)}}
/* Paper (ministry template) — always light, prints in black */
.paper{background:#fff;color:#111;width:794px;min-height:1000px;margin:0 auto;padding:36px 34px;font-family:var(--paperfont);font-size:13.5px;line-height:1.7;direction:rtl}
.paper table{width:100%;border-collapse:collapse;margin-bottom:8px}
.paper th,.paper td{border:1px solid #555;padding:4px 8px;vertical-align:top}
.paper th{background:#e9e9e9;font-weight:700;text-align:center}
.paper .c{text-align:center}
.paper .red{color:#b3141f}
.paper .blue{color:#173c8f;font-weight:700}
.paper .sect{background:#e9e9e9;text-align:center;font-weight:700;border:1px solid #555;padding:3px}
.paper .box{border:1px solid #555;border-top:0;padding:8px 10px;margin-bottom:8px;min-height:40px}
.paper .key{border-right:4px solid #b3141f;background:#fbe9ea;color:#b3141f;padding:4px 10px;margin:6px 0;font-weight:600}
.paper .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.paper .hdr img{max-height:70px;max-width:120px}
.paper .lbl{font-weight:700;background:#e9e9e9;width:140px;white-space:nowrap}
.paper .idea-p{margin-bottom:8px;break-inside:avoid}
.rt{display:inline-block;transform:scaleX(-1)}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 2px}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.ex{font-size:.72em;line-height:0;vertical-align:.55em;unicode-bidi:isolate}
.p2{padding:26px 26px;font-family:"Noto Naskh Arabic","Traditional Arabic",serif;border:4px double #1d3f9a;outline:2px solid #1d3f9a;outline-offset:3px}
.p2 table.n2{width:100%;border-collapse:collapse;table-layout:fixed}
.p2 .n2>tbody>tr>th,.p2 .n2>tbody>tr>td{border:1px solid #444;padding:5px 8px;vertical-align:middle}
.p2 .n2top{border:0!important;padding:0 0 6px!important}
.p2 .n2top{font-weight:700}
.p2 .n2top>span{display:inline-block;width:33%}
.p2 .n2top>span:nth-child(2){text-align:center;color:#1d3f9a}
.p2 .n2top>span:nth-child(3){text-align:left}
.p2 .n2top b{color:#1d3f9a}
.p2 th.lb{background:#d9d9d9;color:#c00000;font-weight:700;width:78px;text-align:center;font-size:13.5px;line-height:1.5}
.p2 th.lb.vt span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;font-size:16px;font-family:"Aref Ruqaa","Noto Naskh Arabic",serif}
.p2 .c{text-align:center}
.p2 .n2title{font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;color:#c00000;font-size:18px}
.p2 .dg{padding:0!important}
.p2 .n2d{width:100%;border-collapse:collapse;margin:0}
.p2 .n2d th,.p2 .n2d td{border:1px solid #444;padding:3px;height:24px;text-align:center;font-size:12.5px}
.p2 .n2d th{color:#c00000;background:#d9d9d9}
.p2 .bl{margin:2px 0}
.p2 .tls{line-height:2}
.p2 .tl{display:inline-block;margin-left:22px;white-space:nowrap}
.p2 .dots{display:inline-block;width:280px;border-bottom:1px dotted #555}
.p2 .n2body{vertical-align:top!important}
.p2 .n2idea{font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;color:#7030a0;font-size:18px;margin:6px 0}
.p2 .n2bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#e7e6e6;padding:3px 10px;margin:8px 0 4px;font-weight:700;color:#1f3864}
.p2 .n2bar.pr{background:#fde9d9;color:#c00000}
.p2 .n2bar.dis{background:#f3dcf5;color:#7030a0}
.p2 .n2bar.tr{background:#dbe5f1;color:#1f3864}
.p2 .n2prl{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#c00000;font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;font-size:16px;font-weight:700;margin:6px 0}
.p2 .n2prl .n2done{margin:0;font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;font-size:18px}
.p2 .key2{background:#e2efd9;border:1px solid #a9d08e;color:#111;font-weight:700;text-align:center;padding:6px 12px;margin:6px 0}
.p2 .n2val{font-family:"Aref Ruqaa","Noto Naskh Arabic",serif;color:#7030a0;font-size:16px;white-space:nowrap}
.p2 .n2done{text-align:left;font-weight:700;color:#1f3864;font-size:16px;margin:2px 0 6px}
.p2 .n2e{width:100%;border-collapse:collapse;margin:0;table-layout:auto}
.p2 .n2e th,.p2 .n2e td{border:1px solid #444;padding:2px;font-size:10.5px;text-align:center;height:20px;background:#fff;color:#111;font-weight:600}
.p2 .n2sig{margin-top:8px;font-weight:700}
.tw{width:1123px;min-height:0;padding:22px 26px;font-family:"Noto Naskh Arabic","Traditional Arabic",serif;font-size:13px}
.tw .twh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;line-height:1.8}
.tw .twh>div{flex:1}
.tw .twt{font-size:19px}
.tw .c{text-align:center}
.tw table.twg{width:100%;border-collapse:collapse;table-layout:fixed;border:3px double #333}
.tw .twg th,.tw .twg td{border:1px solid #333;padding:6px 8px;vertical-align:top}
.tw .twg th{background:#eee;text-align:center;vertical-align:middle}
.tw .twhd th{font-size:13.5px}
.tw .twbody td{height:330px;line-height:1.75}
.tw .twf{display:flex;justify-content:space-around;margin-top:14px;font-weight:700;font-size:15px}
.pdfmode .paper{min-height:0!important;box-shadow:none!important;padding:4px 6px!important}
.pdfmode .p2{border:0!important;outline:0!important}
.paper .srcl{font-size:11px;color:#555;text-align:center;margin-bottom:6px}
.paper .bookimg{display:block;max-width:100%;max-height:430px;margin:6px auto 4px;border:1px solid #ddd}
.imgslot{display:flex;flex-direction:column;gap:8px}
.imgslot img{max-width:100%;max-height:220px;object-fit:contain;align-self:flex-start;border-radius:8px;border:1px solid var(--line);background:#fff}
.gate{max-width:440px;margin:12vh auto 0;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.cropper{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);border-radius:14px;padding:12px;background:var(--surface2)}
.cropper canvas{width:100%;height:auto;touch-action:none;border-radius:8px;background:#fff;cursor:crosshair}
</style>

async function flush(){

let GATE=(window.claude&&window.claude.use)?{s:"checking"}:null;let USER=null,IS_ADMIN=false;
function vGate(){const g=GATE||{};
  const msg={checking:["جارٍ التحقق من حسابك…",""],signin:["يلزم تسجيل الدخول","افتح المنصة من رابط الدعوة وأنت داخل بحساب Claude الذي دُعيت به."],

   ${g.s!=="checking"&&g.s!=="signin"?`<button class="btn" data-act="gateRetry">تحقّق مرة أخرى</button>`:""}</div>`;}
async function checkAccess(u,id){
  IS_ADMIN=!!(await u.isOwner())||!!(await u.canEdit());if(IS_ADMIN)return true;
  try{const ms=await db.doc("members/"+id).get();const st=ms.exists?(ms.data()||{}).status:null;
    if(st==="approved")return true;
    if(st==="blocked"){GATE={s:"blocked"};return false;}
    const rq=db.doc("requests/"+id);const r=await rq.get();
    if(!r.exists){try{await rq.set({at:Date.now(),note:""});}catch(e){GATE={s:"noaccess"};return false;}}
    GATE={s:"pending",note:r.exists?((r.data()||{}).note||""):""};return false;
  }catch(e){GATE={s:"pending"};return false;}
}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){setBadge("محفوظ على الجهاز",true);return;}
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u){if(GATE){GATE={s:"signin"};render();}setBadge("محفوظ على الجهاز",true);return;}
    const id=await u.id();if(!id){if(GATE){GATE={s:"signin"};render();}setBadge("محفوظ على الجهاز",true);return;}
    db=d;userId=id;USER=u;
    if(!(await checkAccess(u,id))){render();return;}
    GATE=null;mode="db";
    const col=db.collection("data/users/"+userId);
    const read=async k=>{try{const sn=await col.doc(k).get();if(sn.exists){const v=sn.data();if(v&&v.json&&v.v===2)return JSON.parse(v.json);if(v&&v.json&&k==="meta")return JSON.parse(v.json);}}catch(e){}return null;};
    const meta=await read("meta");
    if(meta){
      const structs={};for(const g of ["g6","g7","g8","g9"]){const st=await read(g);if(st)structs[g]=Object.assign({v:2},st);}
      const over={};for(const lid of (meta.touched||[])){const L=await read("L_"+lid);if(L){over[lid]=L;}}
      Object.keys(over).forEach(k=>delete LIDX[k]);Object.keys(over).forEach(k=>LIDX[k]=over[k]);
      applySaved(meta,structs,over);
    }else{
      dirty.add("meta");DOCS.forEach(k=>dirty.add(k));(S.meta.touched||[]).forEach(id=>dirty.add("L_"+id));flush();
    }
    lsSave();setBadge("محفوظ");render();
  }catch(e){setBadge("محفوظ على الجهاز",true);}
}

function imgSlot(k,id){

function twAuto(g,L){
  const pg=t=>{const m=String(t||"").match(/ص\s*\(([^)]+)\)/);return m?" ص("+m[1]+")":"";};
  const s0=L.sessions[0]&&L.sessions[0].content||{};
  const intro=s0.intro||"";
  const lines=[];
  L.sessions.forEach((s,i)=>{const c=s.content||{};const parts=[];
    (c.ideas||[]).forEach(d=>{const t=d.title||"";const b="";
      if(/^(حلّ وناقش|حل وناقش)/.test(t))parts.push("يناقش المعلّم مع المتعلّمين فقرة «حلّ وناقش»"+pg(t)+" عن طريق الحوار والأسئلة الموجّهة."+b);
      else if(/^استكشف/.test(t))parts.push("ينفّذ المتعلّمون نشاط «استكشف»"+pg(t)+" في مجموعات، ثم يستنتجون الفكرة."+b);
      else if(/^مثال/.test(t))parts.push("يشرح المعلّم "+t.replace(/\s*ص\s*\([^)]*\)/,"")+pg(t)+" على السبورة بمشاركة المتعلّمين."+b+(d.key?" مع التأكيد على: "+d.key:""));
      else if(/^دورك/.test(t))parts.push("يحلّ المتعلّمون «دورك الآن»"+pg(t)+" بشكل فردي، ويتابع المعلّم ويصحّح."+b);
      else if(/^عبّر/.test(t))parts.push("يعبّر المتعلّمون عن فهمهم"+pg(t)+" ويناقش المعلّم الإجابات."+b);
      else if(/^مهارات/.test(t))parts.push("مناقشة «مهارات تفكير عليا»"+pg(t)+".");
      else if(/^الفكرة/.test(t))parts.push(t+".");});
    if(parts.length)lines.push((L.sessions.length>1?"الحصة "+(i+1)+": ":"")+parts.join(" "));});
  const ex=[];L.sessions.forEach(s=>{const c=s.content||{};(c.ideas||[]).forEach(d=>{if(/^(تدريب صفي|تمارين)/.test(d.title||""))ex.push((d.title||"").replace(/^تدريب صفي:\s*/,""));});if(c.brief)ex.push(c.brief.replace(/\.$/,""));});

/* ---------- print-ready PDF (max two A4 pages per lesson) ---------- */
const libCache={};
function loadLib(key,urls,ok){if(ok())return Promise.resolve();if(libCache[key])return libCache[key];
  libCache[key]=(async()=>{for(const u of urls){const good=await new Promise(r=>{const sc=document.createElement("script");sc.src=u;sc.onload=()=>r(ok());sc.onerror=()=>r(false);document.head.appendChild(sc);});if(good)return;}libCache[key]=null;throw new Error("load "+key);})();return libCache[key];}
function planBreak(H,headH,bounds){
  for(let s=1;s>=.55;s-=.025){const pageH=1150/s;
    if(H<=pageH)return {s,b1:H,two:false};
    const c=bounds.filter(b=>b>pageH*.45&&b<=pageH);if(!c.length)continue;const b1=Math.max(...c);
    if(H-b1+headH<=pageH)return {s,b1,two:true};}
  return null;}
async function makePDF(si){
  if(makePDF.busy)return;makePDF.busy=true;
  const L=getLesson(route);if(!L||!L.sessions[si]){makePDF.busy=false;return;}
  toast("جارٍ تجهيز ملف الطباعة…");
  let host=null;

    await loadLib("h2c",["https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js","https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"],()=>!!window.html2canvas);
    await loadLib("jspdf",["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"],()=>!!(window.jspdf&&window.jspdf.jsPDF));
    await inlineImages(L,si);
    host=document.createElement("div");host.className="pdfmode";host.style.cssText="position:fixed;left:-12000px;top:0;width:794px;background:#fff;direction:rtl";
    host.innerHTML=paperHTML(route.g,route,L,si);document.body.appendChild(host);IMGDATA=null;
    const paper=host.querySelector(".paper");const isP2=paper.classList.contains("p2");
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;})));
    try{await document.fonts.ready;}catch(e){}
    const top=paper.getBoundingClientRect().top;const H=paper.scrollHeight;
    const sel=isP2?".n2>tbody>tr, .idea-p":".paper>table, .sect, .box, .idea-p, .sign";
    const bounds=[...new Set([...paper.querySelectorAll(sel)].flatMap(e=>{const r=e.getBoundingClientRect();return [Math.round(r.top-top),Math.round(r.bottom-top)];}))].filter(b=>b>0&&b<H);
    const head=isP2?paper.querySelector(".n2top"):null;const headH=head?Math.round(head.getBoundingClientRect().bottom-top)+4:0;
    const plan=planBreak(H,headH,bounds);if(!plan)throw new Error("المحتوى أطول من صفحتين؛ اختصر بعض الأفكار أو الصور");
    const SC=2;const canvas=await window.html2canvas(paper,{scale:SC,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:794});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"p",unit:"mm",format:"a4"});
    const mm=194*plan.s/794;const x0=(210-794*mm)/2,y0=8;
    const slice=(fromY,toY,destY)=>{const h=toY-fromY;if(h<=0)return;const cv=document.createElement("canvas");cv.width=canvas.width;cv.height=Math.round(h*SC);
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(canvas,0,Math.round(fromY*SC),canvas.width,cv.height,0,0,cv.width,cv.height);
      pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",x0,destY,794*mm,h*mm);};
    const frame=()=>{if(!isP2)return;pdf.setDrawColor(29,63,154);pdf.setLineWidth(.9);pdf.rect(4,4,202,289);pdf.setLineWidth(.35);pdf.rect(5.6,5.6,198.8,285.8);};
    slice(0,plan.b1,y0);frame();
    if(plan.two){pdf.addPage();let y=y0;if(headH){slice(0,headH,y);y+=headH*mm;}slice(plan.b1,H,y);frame();}
    const blob=pdf.output("blob");
    await saveFile(fileName(L,si,"pdf"),blob);
  }catch(e){console.error(e);toast("تعذّر تجهيز ملف الطباعة: "+((e&&e.message)||"خطأ"));}
  finally{if(host)host.remove();IMGDATA=null;makePDF.busy=false;}
}

/* ---------- book image cropping ---------- */
function setImg(k,val){const c=getLesson(route).sessions[route.s].content;if(k==="intro")c.introImg=val||undefined;else c.ideas[+k].img=val||undefined;}
function getImgQ(k){const c=getLesson(route).sessions[route.s].content;return (c.ideas[+k]||{}).imgQ;}
function setImgQ(k,v){const c=getLesson(route).sessions[route.s].content;c.ideas[+k].imgQ=v||undefined;}
function getImg(k){const c=getLesson(route).sessions[route.s].content;return k==="intro"?c.introImg:c.ideas[+k].img;}
function mountCrop(){
  const cv=document.getElementById("cropCv");if(!cv||!crop||!crop.img)return;
  const im=crop.img;const W=Math.min(1100,im.naturalWidth);const sc=W/im.naturalWidth;cv.width=W;cv.height=Math.round(im.naturalHeight*sc);crop.sc=sc;
  const ctx=cv.getContext("2d");
  const draw=()=>{ctx.drawImage(im,0,0,cv.width,cv.height);const r=crop.sel;if(!r)return;
    const x=Math.min(r.x0,r.x1),y=Math.min(r.y0,r.y1),w=Math.abs(r.x1-r.x0),h=Math.abs(r.y1-r.y0);
    ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,cv.width,y);ctx.fillRect(0,y+h,cv.width,cv.height-y-h);ctx.fillRect(0,y,x,h);ctx.fillRect(x+w,y,cv.width-x-w,h);
    ctx.strokeStyle="#2f8f98";ctx.lineWidth=Math.max(2,cv.width/300);ctx.strokeRect(x,y,w,h);};
  const pos=e=>{const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height};};
  let down=false;
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const p=pos(e);crop.sel={x0:p.x,y0:p.y,x1:p.x,y1:p.y};draw();};
  cv.onpointermove=e=>{if(!down)return;const p=pos(e);crop.sel.x1=p.x;crop.sel.y1=p.y;draw();};
  cv.onpointerup=()=>{down=false;};
  draw();
}
async function cropSave(all){
  if(!crop||!crop.img||crop.busy)return;const im=crop.img;let x=0,y=0,w=im.naturalWidth,h=im.naturalHeight;
  const r=crop.sel;
  if(!all){if(!r||Math.abs(r.x1-r.x0)<10||Math.abs(r.y1-r.y0)<10){toast("حدّد الجزء المطلوب أولاً بالسحب على الصورة.");return;}
    x=Math.min(r.x0,r.x1)/crop.sc;y=Math.min(r.y0,r.y1)/crop.sc;w=Math.abs(r.x1-r.x0)/crop.sc;h=Math.abs(r.y1-r.y0)/crop.sc;}
  const k2=Math.min(1,1000/w);const out=document.createElement("canvas");out.width=Math.round(w*k2);out.height=Math.round(h*k2);
  const ctx=out.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,out.width,out.height);ctx.drawImage(im,x,y,w,h,0,0,out.width,out.height);
  crop.busy=true;render();
  try{
    let assets=null;try{assets=window.claude&&window.claude.use?await window.claude.use("assets"):null;}catch(e){}
    let val;
    if(assets){const blob=await new Promise(res=>out.toBlob(res,"image/jpeg",.85));const up=await assets.upload(blob,{type:"image/jpeg"});val=up.id;}
    else{const k3=Math.min(1,700/out.width);const sm=document.createElement("canvas");sm.width=Math.round(out.width*k3);sm.height=Math.round(out.height*k3);sm.getContext("2d").drawImage(out,0,0,sm.width,sm.height);val=sm.toDataURL("image/jpeg",.6);}
    const k=crop.k,isQ=crop.q;crop=null;if(isQ)setImgQ(k,val);else setImg(k,val);touchCur();render();toast(isQ?"حُفظ سؤال العرض":"أُضيفت الصورة");
  }catch(e){crop.busy=false;render();toast("تعذّر حفظ الصورة. جرّب صورة أصغر.");}
}

    if(o==="c"){L.sessions[route.s].content[f]=t.value;touchCur();return;}
  }
  if(d.tw){const L=LIDX[route.l];S.meta.tw=S.meta.tw||{};S.meta.tw[L.id]=Object.assign(twData(route.g,L),S.meta.tw[L.id]||{},{[d.tw]:t.value});touch("meta");return;}
  if(d.item!==undefined){getLesson(route).items[ui.tab][+d.item].t=t.value;touchCur();return;}
  if(d.idea!==undefined){getLesson(route).sessions[route.s].content.ideas[+d.idea][d.f]=d.f==="space"?+t.value:t.value;touchCur();return;}
  if(d.row!==undefined){getLesson(route).sessions[route.s].content.rows[+d.row][d.f]=t.value;touchCur();return;}
  if(d.sec){S.meta.sections[d.sec]=en(t.value).split(/[،,]/).map(x=>x.trim()).filter(Boolean);touch("meta");return;}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="twW"){ui.twWeek=+t.value;render();return;}
  if(t.id==="sheetDate"){ui.sheetDate=t.value||todayISO();render();return;}
  if(t.dataset.row!==undefined&&t.tagName==="SELECT"){getLesson(route).sessions[route.s].content.rows[+t.dataset.row].cls=t.value;touchCur();}
  if(t.id==="cropFile"&&t.files[0]&&crop){const url=URL.createObjectURL(t.files[0]);const im=new Image();
    im.onload=()=>{crop.img=im;crop.sel=null;render();};im.onerror=()=>toast("تعذّر فتح الصورة. اختر صورة PNG أو JPG.");im.src=url;}
  if(t.id==="aLogo"&&t.files[0]){const f=t.files[0];const img=new Image();const url=URL.createObjectURL(f);
    img.onload=()=>{const k=Math.min(1,220/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);S.meta.logo=cv.toDataURL("image/png");URL.revokeObjectURL(url);touch("meta");render();};
    img.onerror=()=>toast("تعذّر قراءة الصورة. جرّب صورة PNG أو JPG.");img.src=url;}
  if(t.id==="restore"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.meta||!o.g9||!o.L)throw 0;
      Object.keys(o.L).forEach(k=>LIDX[k]=o.L[k]);applySaved(o.meta,o,o.L);DOCS.forEach(k=>dirty.add(k));(S.meta.touched||[]).forEach(id=>dirty.add("L_"+id));touch("meta");render();toast("تمت استعادة النسخة");}catch(x){toast("الملف ليس نسخة احتياطية من منصة التحضير.");}};fr.readAsText(t.files[0]);}
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="jump"){e.preventDefault();app.querySelector('[data-act="jump"]').click();}});
document.getElementById("backBtn").onclick=back;
document.getElementById("tabHome").onclick=home;
document.getElementById("tabAcc").onclick=()=>{stack.length=0;route={v:"account"};render();window.scrollTo(0,0);};
const THK="prep-theme";
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");}
try{applyTheme(localStorage.getItem(THK));}catch(e){}
document.getElementById("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark";applyTheme(nx);try{localStorage.setItem(THK,nx)}catch(e){}};

render();connect();
})();
</script>
